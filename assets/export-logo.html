<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Export WindowLogo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      background: #1a1a2e;
      min-height: 100vh;
    }
    h1 {
      color: white;
      margin-bottom: 30px;
    }
    .preview {
      background: #16213e;
      padding: 40px;
      border-radius: 20px;
      margin-bottom: 30px;
    }
    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: linear-gradient(135deg, #e94560, #0f3460);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.05);
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Window Logo Export</h1>
  
  <div class="preview">
    <svg id="logo" width="512" height="512" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#87CEEB" stop-opacity="0.9" />
          <stop offset="50%" stop-color="#5BA8D0" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#4A9BC7" stop-opacity="0.9" />
        </linearGradient>
        <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
          <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="50%" stop-color="#f5f5f5" />
          <stop offset="100%" stop-color="#e8e8e8" />
        </linearGradient>
        <linearGradient id="innerFrameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f8f8f8" />
          <stop offset="100%" stop-color="#e0e0e0" />
        </linearGradient>
        <linearGradient id="sillGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#d0d0d0" />
        </linearGradient>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e94560" />
          <stop offset="100%" stop-color="#0f3460" />
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="130" height="130" rx="20" fill="url(#bgGradient)" />
      <rect x="22" y="22" width="90" height="95" rx="3" fill="rgba(0,0,0,0.2)" />
      <rect x="18" y="15" width="94" height="90" rx="4" fill="url(#frameGradient)" stroke="#c0c0c0" stroke-width="1" />
      <g>
        <rect x="24" y="21" width="38" height="78" rx="2" fill="url(#innerFrameGradient)" stroke="#b0b0b0" stroke-width="0.5" />
        <rect x="28" y="25" width="30" height="70" rx="1" fill="url(#glassGradient)" />
        <path d="M28 25 L58 25 L58 35 L38 95 L28 95 Z" fill="url(#glassHighlight)" opacity="0.6" />
        <rect x="68" y="21" width="38" height="78" rx="2" fill="url(#innerFrameGradient)" stroke="#b0b0b0" stroke-width="0.5" />
        <rect x="72" y="25" width="30" height="70" rx="1" fill="url(#glassGradient)" />
        <path d="M72 25 L102 25 L102 35 L82 95 L72 95 Z" fill="url(#glassHighlight)" opacity="0.6" />
        <rect x="62" y="21" width="6" height="78" fill="url(#innerFrameGradient)" stroke="#b0b0b0" stroke-width="0.5" />
      </g>
      <g>
        <rect x="54" y="56" width="2" height="12" rx="1" fill="#909090" />
        <rect x="53" y="55" width="4" height="3" rx="1" fill="#a0a0a0" />
      </g>
      <g>
        <rect x="74" y="56" width="2" height="12" rx="1" fill="#909090" />
        <rect x="73" y="55" width="4" height="3" rx="1" fill="#a0a0a0" />
      </g>
      <path d="M12 105 L18 99 L112 99 L118 105 L118 112 L12 112 Z" fill="url(#sillGradient)" stroke="#c0c0c0" stroke-width="0.5" />
      <path d="M15 112 L115 112 L118 115 L12 115 Z" fill="rgba(0,0,0,0.15)" />
    </svg>
  </div>

  <div class="buttons">
    <button onclick="downloadPNG(512)">Скачать PNG 512x512</button>
    <button onclick="downloadPNG(1024)">Скачать PNG 1024x1024</button>
    <button onclick="downloadPNG(256)">Скачать PNG 256x256</button>
    <button onclick="downloadPNG(128)">Скачать PNG 128x128</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    function downloadPNG(size) {
      const svg = document.getElementById('logo');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = size;
      canvas.height = size;
      
      const data = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([data], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      
      const img = new Image();
      img.onload = function() {
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        
        const link = document.createElement('a');
        link.download = `WindowLogo_${size}x${size}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        URL.revokeObjectURL(url);
      };
      img.src = url;
    }
  </script>
</body>
</html>
